---
# Configure system services and daemons

- name: Services configuration
  hosts: all
  become: false
  tasks:
    - name: Enable dark theme
      ansible.builtin.command:
        cmd: gsettings set org.gnome.desktop.interface color-scheme prefer-dark
      tags:
        - gnome
    
    - name: Set wallpaper
      ansible.builtin.command:
        cmd: gsettings set org.gnome.desktop.background picture-uri 'file:///usr/share/backgrounds/ubuntu-wallpaper-d.png'
      when: "'work' in group_names"
      tags:
        - gnome
        - work

    - name: Disable mouse acceleration
      ansible.builtin.command:
        cmd: gsettings set org.gnome.desktop.peripherals.mouse accel-profile 'flat'
      tags:
        - gnome

    - name: Set shortcut to open Home folder
      ansible.builtin.command:
        cmd: gsettings set org.gnome.settings-daemon.plugins.media-keys home '<Super>e'
      when: "'work' in group_names"
      tags:
        - gnome
        - work

    - name: Enable Gnome extensions (Work)
      ansible.builtin.command:
        cmd: gsettings set org.gnome.shell enabled-extensions "['user-theme@gnome-shell-extensions.gcampax.github.com', 'dash-to-panel@jderose9.github.com']"
      when: "'work' in group_names"
      failed_when: false
      tags:
        - gnome
        - extensions
        - work

    - name: Configure Dash to Panel - Display panels on all monitors OFF (Work)
      ansible.builtin.shell:
        cmd: dconf write /org/gnome/shell/extensions/dash-to-panel/multi-monitors "false"
      when: "'work' in group_names"
      failed_when: false
      tags:
        - gnome
        - extensions
        - work

    - name: Configure Dash to Panel - Intellihide ON (Work)
      ansible.builtin.shell:
        cmd: dconf write /org/gnome/shell/extensions/dash-to-panel/intellihide "true"
      when: "'work' in group_names"
      failed_when: false
      tags:
        - gnome
        - extensions
        - work

    - name: Configure Dash to Panel - icon margin (Work)
      ansible.builtin.shell:
        cmd: dconf write /org/gnome/shell/extensions/dash-to-panel/appicon-margin "4"
      when: "'work' in group_names"
      failed_when: false
      tags:
        - gnome
        - extensions
        - work

    - name: Configure Dash to Panel - do not sync monitor settings (Work)
      ansible.builtin.shell:
        cmd: dconf write /org/gnome/shell/extensions/dash-to-panel/panel-element-positions-monitors-sync "false"
      when: "'work' in group_names"
      failed_when: false
      tags:
        - gnome
        - extensions
        - work

    - name: Configure Dash to Panel - Panel thickness 48px (Work)
      ansible.builtin.shell:
        cmd: dconf write /org/gnome/shell/extensions/dash-to-panel/panel-sizes '{"0":48}'
      when: "'work' in group_names"
      failed_when: false
      tags:
        - gnome
        - extensions
        - work

    - name: Configure Dash to Panel - Border radius 0px (Work)
      ansible.builtin.shell:
        cmd: dconf write /org/gnome/shell/extensions/dash-to-panel/global-border-radius "0"
      when: "'work' in group_names"
      failed_when: false
      tags:
        - gnome
        - extensions
        - work
        
    - name: Configure Dash to Panel - Animate hover ON, Simple, 100ms (Work)
      ansible.builtin.shell:
        cmd: dconf write /org/gnome/shell/extensions/dash-to-panel/animate-appicon-hover "true"
      when: "'work' in group_names"
      failed_when: false
      tags:
        - gnome
        - extensions
        - work

    - name: Configure Dash to Panel - Animation duration 100ms (Work)
      ansible.builtin.shell:
        cmd: "dconf write /org/gnome/shell/extensions/dash-to-panel/animate-appicon-hover-animation-duration \"{'SIMPLE': <uint32 100>, 'RIPPLE': <uint32 130>, 'PLANK': <uint32 100>}\""
      when: "'work' in group_names"
      failed_when: false
      tags:
        - gnome
        - extensions
        - work

    - name: Configure Dash to Panel - Icon style NORMAL (Work)
      ansible.builtin.shell:
        cmd: dconf write /org/gnome/shell/extensions/dash-to-panel/appicon-style "'NORMAL'"
      when: "'work' in group_names"
      failed_when: false
      tags:
        - gnome
        - extensions
        - work

    - name: Configure Dash to Panel - Running indicator FOCUSED dashes (Work)
      ansible.builtin.shell:
        cmd: dconf write /org/gnome/shell/extensions/dash-to-panel/dot-style-focused "'DASHES'"
      when: "'work' in group_names"
      failed_when: false
      tags:
        - gnome
        - extensions
        - work

    - name: Configure Dash to Panel - Running indicator UNFOCUSED dashes (Work)
      ansible.builtin.shell:
        cmd: dconf write /org/gnome/shell/extensions/dash-to-panel/dot-style-unfocused "'DASHES'"
      when: "'work' in group_names"
      failed_when: false
      tags:
        - gnome
        - extensions
        - work

    - name: Configure Dash to Panel - Keep original top panel ON (Work)
      ansible.builtin.shell:
        cmd: dconf write /org/gnome/shell/extensions/dash-to-panel/stockgs-keep-top-panel "true"
      when: "'work' in group_names"
      failed_when: false
      tags:
        - gnome
        - extensions
        - work

    - name: Set User Theme name (Work)
      ansible.builtin.shell:
        cmd: dconf write /org/gnome/shell/extensions/user-theme/name "''"
      when: "'work' in group_names"
      failed_when: false
      tags:
        - gnome
        - extensions
        - work

    - name: Configure GlobalProtect browser authentication (Work)
      ansible.builtin.lineinfile:
        path: /opt/paloaltonetworks/globalprotect/pangps.xml
        line: '\t\t<default-browser>yes</default-browser>'
        insertafter: '^\t<Settings>'
      become: true
      when: "'work' in group_names"
      failed_when: false
      tags:
        - globalprotect
        - work

        