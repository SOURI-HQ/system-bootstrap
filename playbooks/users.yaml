---
# Configure users, groups, and SSH keys

- name: Configure users
  hosts: all
  become: true
  tasks:
    - name: Configure sudo NOPASSWD
      ansible.builtin.lineinfile:
        path: /etc/sudoers
        line: 'ALL=(ALL) NOPASSWD: ALL'
        validate: 'visudo -cf %s'
        state: present
      tags:
        - users
        - sudo

    - name: Ensure .ssh directory exists
      ansible.builtin.file:
        path: ~/.ssh
        state: directory
        mode: '0700'
      tags:
        - users
        - ssh

    - name: Restore SSH keys
      ansible.builtin.copy:
        src: /mnt/backup/secret_material/ssh_keys
        dest: ~/.ssh
        remote_src: true
        mode: '0600'
        owner: "{{ ansible_user_id }}"
      when: "'work' in group_names"
      tags:
        - users
        - ssh
        - work

    - name: Restore GPG keys
      ansible.builtin.shell:
        cmd: gpg --import /mnt/backup/secret_material/gpg_keys/*.gpg
      when: "'work' in group_names"
      tags:
        - users
        - gpg
        - work
        