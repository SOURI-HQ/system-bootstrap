---
# Install system packages and software

- name: Install packages
  hosts: all
  become: true
  tasks:
    - name: Install development tools
      ansible.builtin.package:
        name: "{{ develop_packages }}"
        state: present
      tags:
        - packages
        - develop

    - name: Install tool packages
      ansible.builtin.package:
        name: "{{ tool_packages }}"
        state: present
      tags:
        - packages
        - tools

    - name: Install desktop environment packages
      ansible.builtin.package:
        name: "{{ desktop_packages }}"
        state: present
      tags:
        - packages
        - desktop
      when: desktop_packages is defined

    - name: Install application
      ansible.builtin.package:
        name: "{{ application_packages }}"
        state: present
      tags:
        - packages
        - applications
      when: application_packages is defined

    - name: Install outlook-electron
      ansible.builtin.command:
        cmd: snap install outlook-electron
      when: "'work' in group_names"
      failed_when: false
      tags:
        - packages
        - applications
        - work

    - name: Include Docker installation playbook (Work)
      ansible.builtin.include_tasks: docker.yaml
      when: "'work' in group_names"
      tags:
        - packages
        - docker
        - work
        